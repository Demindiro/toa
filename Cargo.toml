[workspace]
resolver = "3"
members = ["toa", "toa-blob", "toa-cli", "toa-fuse", "toa-hash", "fuzz", "toa-blob-compress", "toa-blob-store", "toasum"]
exclude = ["wasm-toa-hash"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"

# https://github.com/rust-lang/cargo/issues/4897#issuecomment-1767587337
[profile.web-release]
inherits = "release"
panic = "abort"
opt-level = 's'
lto = "fat"
strip = true
