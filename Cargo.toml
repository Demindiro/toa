[workspace]
resolver = "3"
members = ["toa", "toa-blob", "toa-cli", "toa-fuse", "toa-hash", "fuzz", "toa-blob-compress", "toa-blob-store", "toasum", "toa-server"]
exclude = ["wasm-toa-hash"]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
arrayvec = { version = "0.7.6", default-features = false }
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
bstr = { version = "1.12.1", default-features = false }
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
criterion = { version = "0.7.0", features = ["html_reports"] }
env_logger = "0.11.8"
fuser = "0.16.0"
libc = "0.2.178"
lz4_flex = { version = "0.13.0", default-features = false, features = ["checked-decode", "safe-decode", "safe-encode"] }
memmap2 = { version = "0.9.9", default-features = false }
nora_endian = "0.1.3"
popol = "3.0.1"
rand = { version = "0.8.0" }
regex = "1.12.3"
sha3 = { version = "0.10.8", default-features = false }
sled = { version = "0.34.7" }
toa-blob-compress = { path = "toa-blob-compress" }
toa-blob = { path = "toa-blob" }
toa-blob-store = { path = "toa-blob-store" }
toa-hash = { path = "toa-hash" }
toa = { path = "toa", features = ["lz4", "zstd", "accel-sled"] }
zstd-safe = { version = "7.2.4", default-features = false, features = [] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"

# https://github.com/rust-lang/cargo/issues/4897#issuecomment-1767587337
[profile.web-release]
inherits = "release"
panic = "abort"
opt-level = 's'
lto = "fat"
strip = true
