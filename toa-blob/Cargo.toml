[package]
name = "toa-blob"
version = "0.1.0"
edition = "2024"

[features]
std = []
mmap = ["std", "dep:memmap2"]

[dependencies]
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
memmap2 = { version = "0.9.10", optional = true }
nora_endian = "0.1.3"
toa-blob-store = { path = "../toa-blob-store" }
