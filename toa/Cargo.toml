[package]
name = "toa"
version = "0.1.0"
edition = "2024"

[features]
lz4 = ["toa-blob-compress/lz4"]
zstd = ["toa-blob-compress/zstd"]
accel-sled = ["dep:sled"]

[dependencies]
toa-blob = { path = "../toa-blob" }
toa-blob-store = { path = "../toa-blob-store" }
toa-blob-compress = { path = "../toa-blob-compress" }
toa-hash = { path = "../toa-hash" }
arrayvec = { version = "0.7.6", default-features = false }
bytemuck = "1.25.0"
sled = { version = "0.34.7", optional = true }
