[package]
name = "toa"
version = "0.1.0"
edition = "2024"

[features]
blob-compress = ["dep:toa-blob-compress"]

[dependencies]
toa-blob = { path = "../toa-blob" }
toa-blob-compress = { path = "../toa-blob-compress", optional = true }
toa-hash = { path = "../toa-hash" }
arrayvec = { version = "0.7.6", default-features = false }
bytemuck = "1.25.0"
